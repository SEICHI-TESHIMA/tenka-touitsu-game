<!DOCTYPE html>
<html>

<body>
  <h1>All Scenarios Verification</h1>
  <div id="results"></div>
  <script>
    const log = (msg, isFail = false) => {
      const d = document.createElement('div');
      d.textContent = msg;
      d.style.color = isFail ? 'red' : 'green';
      document.getElementById('results').appendChild(d);
      if (isFail) {
        console.error(msg);
      } else {
        console.log(msg);
      }
    };

    let passCount = 0;
    let failCount = 0;

    function assert(cond, msg) {
      if (cond) {
        passCount++;
        log('PASS: ' + msg);
      } else {
        failCount++;
        log('FAIL: ' + msg, true);
      }
    }

    function initScenario(year) {
      const state = Object.create(window.GameState);
      const scen = window.SCENARIOS_DATA.find(s => String(s.year) === String(year));
      state.year = Number(year);
      state.initFromScenario(scen);
      return state;
    }

    function runTests() {
      // --- 1331 ---

        log('--- SCENARIO 1331 ---');
        const s = initScenario(1331);
        const shiba = s.activeOfficers.find(o => o.id === 'off_dm_shiba_1331');

        const shiba_u = s.activeOfficers.find(o => o.id === 'off_jd_322');
        assert(shiba_u && shiba_u.clanId === 'shiba_uzen' && shiba_u.isDaimyo, '1331 Shiba Iekane is daimyo of shiba_uzen in Uzen');
